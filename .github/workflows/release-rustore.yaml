name: RuStore Release AAB

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build RuStore AAB
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit in the history of main."
            exit 1
          fi

      # Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      # Setup Gradle with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run RuStore unit tests
        run: ./gradlew :app:testRustoreDebugUnitTest --no-configuration-cache

      # Build signed RuStore AAB
      - name: Build and verify signed RuStore bundle
        shell: bash
        env:
          ORG_GRADLE_PROJECT_enableRustoreTracer: "true"
          ORG_GRADLE_PROJECT_tracerAppToken: ${{ secrets.TRACER_APP_TOKEN }}
          ORG_GRADLE_PROJECT_tracerPluginToken: ${{ secrets.TRACER_PLUGIN_TOKEN }}
          RUSTORE_KEYSTORE_BASE64: ${{ secrets.RUSTORE_KEYSTORE_BASE64 }}
          RUSTORE_KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          RUSTORE_KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
          RUSTORE_KEY_PASSWORD: ${{ secrets.RUSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Validate required secrets
          : "${RUSTORE_KEYSTORE_BASE64:?Missing RUSTORE_KEYSTORE_BASE64}"
          : "${RUSTORE_KEYSTORE_PASSWORD:?Missing RUSTORE_KEYSTORE_PASSWORD}"
          : "${RUSTORE_KEY_ALIAS:?Missing RUSTORE_KEY_ALIAS}"
          : "${RUSTORE_KEY_PASSWORD:?Missing RUSTORE_KEY_PASSWORD}"

          # Restore keystore
          export RUSTORE_KEYSTORE_PATH
          RUSTORE_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/rustore-keystore.XXXXXX")

          # Remove keystore after execution
          trap 'rm -f -- "$RUSTORE_KEYSTORE_PATH"' EXIT

          printf '%s' "$RUSTORE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUSTORE_KEYSTORE_PATH"

          unset RUSTORE_KEYSTORE_BASE64

          # Build release bundle
          ./gradlew :app:bundleRustoreRelease \
            --no-configuration-cache \
            -PrustoreReleaseSigning=true

          # Verify bundle exists
          AAB_PATH="app/build/outputs/bundle/rustoreRelease/app-rustore-release.aab"

          if [[ ! -s "$AAB_PATH" ]]; then
            echo "Error: RuStore AAB not found or empty"
            exit 1
          fi

          # Verify signature
          VERIFY_OUTPUT=$(jarsigner \
            -verify \
            -keystore "$RUSTORE_KEYSTORE_PATH" \
            -storepass:env RUSTORE_KEYSTORE_PASSWORD \
            "$AAB_PATH" \
            "$RUSTORE_KEY_ALIAS" 2>&1)

          printf '%s\n' "$VERIFY_OUTPUT"

          if [[ "$VERIFY_OUTPUT" != *"jar verified."* ]]; then
            echo "Error: AAB signature verification failed"
            exit 1
          fi

          if grep -Eiq \
            'unsigned entries|not signed by.*alias|not signed by specified alias' \
            <<< "$VERIFY_OUTPUT"; then
            echo "Error: AAB contains unsigned entries or an unexpected signer"
            exit 1
          fi

          echo "RuStore AAB successfully built and verified"

      # Upload artifact
      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: rustore-release-${{ github.sha }}
          path: app/build/outputs/bundle/rustoreRelease/app-rustore-release.aab
          if-no-files-found: error
          overwrite: true
          retention-days: 30
